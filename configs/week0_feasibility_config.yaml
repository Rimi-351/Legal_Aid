# ==============================================================================
# Legal Aid BD — Week 0 Research Readiness & Feasibility Configuration
# Hardware Target: Windows 10/11 PC, 16 GB RAM Budget
# ==============================================================================

project:
  name: "Legal Aid BD"
  phase: "Week 0 — Research Readiness & Feasibility Checks"
  version: "0.1.0"
  random_seed: 42

hardware_budget:
  system_ram_gb: 16.0
  max_process_rss_mb: 11776.0       # 11.5 GB RSS safety ceiling to prevent Windows paging
  warning_process_rss_mb: 9216.0    # 9.0 GB RSS warning threshold
  max_concurrent_models: 1          # Strictly sequential model loading
  garbage_collection_cooldown_sec: 2.0

database:
  host: "localhost"
  port: 5432
  dbname: "legalaid_db"
  user: "postgres"
  password: ""                      # Override via PG_PASSWORD environment variable
  vector_extension: "vector"
  test_table_name: "w0_pgvector_test"
  test_vector_dimensions:
    - 768                           # Multilingual-E5-base / BGE-base
    - 1024                          # BGE-M3

audit_paths:
  sample_audit_dir: "data/raw/sample_audit_files"
  manifest_output: "data/manifests/week0_source_audit_log.jsonl"
  benchmark_output: "data/manifests/week0_compute_benchmark.json"

models:
  embeddings:
    - name: "BAAI/bge-m3"
      revision: "5617a9f61b028005a4858fdac845db406aefb181"
      dimension: 1024
      max_seq_length: 8192
      device_preference: "cpu"      # 'cuda' if GPU with >=6GB VRAM available, else 'cpu'
      batch_size: 4
      rss_limit_mb: 4096.0
    - name: "intfloat/multilingual-e5-base"
      revision: "d128750597153bb5987e10b1c3493a34e5a4502a"
      dimension: 768
      max_seq_length: 512
      device_preference: "cpu"
      batch_size: 8
      rss_limit_mb: 2560.0

  rerankers:
    - name: "BAAI/bge-reranker-v2-m3"
      revision: "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e"
      device_preference: "cpu"
      batch_size: 2
      rss_limit_mb: 3584.0

  local_llm:
    provider: "ollama"              # 'ollama' or 'llama_cpp'
    ollama_api_base: "http://localhost:11434"
    candidates:
      - "qwen2.5:3b-instruct-q4_K_M"
      - "llama3.2:3b-instruct-q4_K_M"
    timeout_seconds: 45
    rss_limit_mb: 5120.0
    max_tokens: 512
    temperature: 0.1

sample_test_passages:
  - id: "CA1872_S10"
    domain: "contractual_obligations"
    act_title: "The Contract Act, 1872"
    section: "10"
    language: "en"
    text: "All agreements are contracts if they are made by the free consent of parties competent to contract, for a lawful consideration and with a lawful object, and are not hereby expressly declared to be void."
  
  - id: "CA1872_S11"
    domain: "contractual_obligations"
    act_title: "The Contract Act, 1872"
    section: "11"
    language: "en"
    text: "Every person is competent to contract who is of the age of majority according to the law to which he is subject, and who is of sound mind, and is not disqualified from contracting by any law to which he is subject."

  - id: "CRPA2009_S37"
    domain: "consumer_protection"
    act_title: "ভোক্তা অধিকার সংরক্ষণ আইন, ২০০৯"
    section: "৩৭"
    language: "bn"
    text: "কোন ব্যক্তি কোন আইন বা বিধির অধীন নির্ধারিত বাধ্যবাধকতা অমান্য করিয়া কোন পণ্যের মোড়কে পণ্য বা সেবার খুচরা বিক্রয় মূল্য, ওজন বা মেয়াদ উত্তীর্ণের তারিখ উল্লেখ না করিলে তিনি অনূর্ধ্ব এক বৎসর কারাদণ্ড, বা অনধিক পঞ্চাশ হাজার টাকা অর্থদণ্ড, বা উভয় দণ্ডে দণ্ডনীয় হইবেন।"

  - id: "CRPA2009_S45"
    domain: "consumer_protection"
    act_title: "ভোক্তা অধিকার সংরক্ষণ আইন, ২০০৯"
    section: "৪৫"
    language: "bn"
    text: "কোন ব্যক্তি সেবাগ্রহীতার জীবন বা নিরাপত্তা বিপন্ন হইতে পারে এইরূপ অবহেলা, দায়িত্বহীনতা বা অসতর্কতা দ্বারা সেবা প্রদান করিলে তিনি অনূর্ধ্ব তিন বৎসর কারাদণ্ড বা অনধিক দুই লক্ষ টাকা অর্থদণ্ড বা উভয় দণ্ডে দণ্ডনীয় হইবেন।"

  - id: "BLA2006_S20"
    domain: "labour_and_employment"
    act_title: "বাংলাদেশ শ্রম আইন, ২০০৬"
    section: "২০"
    language: "bn"
    text: "কোন শ্রমিককে তাহার শারীরিক বা মানসিক অক্ষমতা বা অব্যাহত ভগ্নস্বাস্থ্যের কারণে কোন রেজিস্টার্ড চিকিৎসক কর্তৃক প্রত্যায়িত হওয়া সাপেক্ষে চাকরি হইতে অবসর প্রদান বা ছাঁটাই করা যাইতে পারে।"

  - id: "BLA2006_S26"
    domain: "labour_and_employment"
    act_title: "বাংলাদেশ শ্রম আইন, ২০০৬"
    section: "২৬"
    language: "bn"
    text: "মালিক কোন স্থায়ী শ্রমিককে তাহার চাকরির অবসান করিতে পারিবে, যদি তাহাকে একশত বিশ দিনের লিখিত নোটিশ প্রদান করা হয় অথবা নোটিশের পরিবর্তে একশত বিশ দিনের মজুরি প্রদান করা হয়।"

  - id: "PRCA1991_S13"
    domain: "land_and_tenancy"
    act_title: "বাড়ি ভাড়া নিয়ন্ত্রণ আইন, ১৯৯১"
    section: "১৩"
    language: "bn"
    text: "কোন বাড়ীর মানসম্মত ভাড়া নির্ধারণের জন্য বাড়ীর মালিক বা ভাড়াটিয়ার আবেদনের প্রেক্ষিতে নিয়ন্ত্রক মানসম্মত ভাড়া নির্ধারণ করিতে পারিবেন।"

  - id: "PRCA1991_S18"
    domain: "land_and_tenancy"
    act_title: "বাড়ি ভাড়া নিয়ন্ত্রণ আইন, ১৯৯১"
    section: "১৮"
    language: "bn"
    text: "ভাড়াটিয়া কর্তৃক নিয়মিত ভাড়া পরিশোধ করা হইলে এবং চুক্তির শর্ত পালন করিলে তাহাকে উচ্ছেদ করা যাইবে না, তবে মালিকের নিজস্ব যুক্তিসঙ্গত প্রয়োজন থাকিলে আদালতের মাধ্যমে উচ্ছেদের আদেশ দেওয়া যাইতে পারে।"

  - id: "TPA1882_S54"
    domain: "land_and_tenancy"
    act_title: "The Transfer of Property Act, 1882"
    section: "54"
    language: "en"
    text: "'Sale' is a transfer of ownership in exchange for a price paid or promised or part-paid and part-promised. Such transfer, in the case of tangible immovable property of the value of one hundred taka and upwards, can be made only by a registered instrument."

  - id: "TPA1882_S106"
    domain: "land_and_tenancy"
    act_title: "The Transfer of Property Act, 1882"
    section: "106"
    language: "en"
    text: "In the absence of a written contract or local law or usage to the contrary, a lease of immovable property for agricultural or manufacturing purposes shall be deemed to be a lease from year to year, terminable, on the part of either lessor or lessee, by six months notice expiring with the end of a year of the tenancy."

sample_test_queries:
  - id: "Q01_BN"
    text: "দোকানদার পণ্যের গায়ে মেয়াদোত্তীর্ণের তারিখ না লিখে বিক্রি করলে কি শাস্তি হবে?"
    language: "bn"
    domain: "consumer_protection"
  - id: "Q01_BANGLISH"
    text: "Dokandar expiry date na likhe ponno sell korle ki shasti hobe?"
    language: "banglish"
    domain: "consumer_protection"
  - id: "Q01_EN"
    text: "What is the penalty if a seller sells goods without mentioning expiration date on packaging?"
    language: "en"
    domain: "consumer_protection"
  - id: "Q02_BN"
    text: "চাকরির বয়স শেষ না হতেই মালিক নোটিশ ছাড়া বরখাস্ত করলে কত দিনের মজুরি দিতে হবে?"
    language: "bn"
    domain: "labour_and_employment"
  - id: "Q02_BANGLISH"
    text: "Chakri theke notice chara terminate korle koto diner salary pabo labour law onujayi?"
    language: "banglish"
    domain: "labour_and_employment"
  - id: "Q02_EN"
    text: "How many days notice or compensation must an employer provide to terminate a permanent worker under Bangladesh labour law?"
    language: "en"
    domain: "labour_and_employment"
  - id: "Q03_BN"
    text: "বাড়িওয়ালা কি ইচ্ছামত ভাড়া বাড়িয়ে আমাকে বাড়ি থেকে উচ্ছেদ করতে পারবে?"
    language: "bn"
    domain: "land_and_tenancy"
  - id: "Q03_BANGLISH"
    text: "Bariwala iccha moto rent bariye keno evict korte parbe? Rent control law te ki ache?"
    language: "banglish"
    domain: "land_and_tenancy"
  - id: "Q04_EN"
    text: "Can a minor enter into a legally binding business agreement under Bangladesh Contract Act?"
    language: "en"
    domain: "contractual_obligations"
  - id: "Q04_BANGLISH"
    text: "Minor ba 18 bochorer kom boyosher keu business contract sign korle oita ki valid?"
    language: "banglish"
    domain: "contractual_obligations"
